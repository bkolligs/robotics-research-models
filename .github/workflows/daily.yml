name: daily corpus update

on:
  # Monthly Modal refresh owns scheduled updates. Keep this short-window
  # command available for manual maintenance; its 14-day guard is unchanged.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-corpus
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Append new cs.RO papers
        run: uv run --no-dev --group bulk mentions-daily
      - name: Commit corpus and summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data/corpus ]; then git add data/corpus; fi
          if [ -f output/summary.json ]; then git add output/summary.json; fi
          if git diff --cached --quiet; then
            echo "no corpus changes"
          else
            git commit -m "chore: update cs.RO mention corpus"
            git push
          fi
