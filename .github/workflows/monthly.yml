name: monthly trends update

on:
  schedule:
    - cron: "30 12 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Production submission month YYYY-MM (defaults to previous UTC month)"
        type: string
        required: false
      test_month:
        description: "Optional YYYY-MM: isolated test, no corpus commit or Pages publication"
        type: string
        required: false

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: monthly-corpus
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MENTIONS_MODAL_APP: robotics-research-monthly
    steps:
      - uses: actions/checkout@v4
      - name: Check authentication configuration
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo "Missing MODAL_TOKEN_ID secret"; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo "Missing MODAL_TOKEN_SECRET secret"; exit 1; }
          test -n "$AWS_ROLE_ARN" || { echo "Set AWS_ROLE_ARN repository variable (see docs/MONTHLY_UPDATES.md)"; exit 1; }
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group bulk --group modal
      - name: Select submission month
        env:
          REQUESTED_MONTH: ${{ inputs.month }}
          TEST_MONTH: ${{ inputs.test_month }}
        run: |
          uv run --no-sync python - <<'PYTHON'
          import os, re
          from datetime import datetime, timezone
          from mentions.catalog import previous_month
          requested, test = os.environ['REQUESTED_MONTH'], os.environ['TEST_MONTH']
          if requested and test:
              raise ValueError('Choose a production month or a test month, not both')
          month = test or requested or previous_month(datetime.now(timezone.utc).date())
          if not re.fullmatch(r'\d{4}-(0[1-9]|1[0-2])', month) or month < '2023-01':
              raise ValueError('Invalid study month')
          volume = ('robotics-research-test-' + os.environ['GITHUB_RUN_ID'] if test
                    else 'robotics-research-month-' + month)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'TARGET_MONTH={month}\nMENTIONS_MODAL_VOLUME={volume}\n')
          print(f'Cataloging {month} using {volume}')
          PYTHON
      - name: Synchronize cached OAI-PMH metadata on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: uv run --no-sync modal run scripts/modal_harvest.py --month "$TARGET_MONTH"
      - name: Obtain temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 21600
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::arxiv/pdf/*"}]}
      - name: Update full-text corpus on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: uv run --no-sync modal run scripts/modal_pipeline.py --workers 10
      - name: Download validated database
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: uv run --no-sync modal volume get "$MENTIONS_MODAL_VOLUME" papers.sqlite data/month-papers.sqlite
      - name: Merge production month into catalog
        if: inputs.test_month == ''
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          uv run --no-sync modal volume get robotics-research-papers catalog.sqlite data/catalog-base.sqlite
          uv run --no-sync python -m mentions.catalog --base data/catalog-base.sqlite --incoming data/month-papers.sqlite --output data/analysis-papers.sqlite --month "$TARGET_MONTH" --source-volume "$MENTIONS_MODAL_VOLUME"
      - name: Select isolated test database
        if: inputs.test_month != ''
        run: cp data/month-papers.sqlite data/analysis-papers.sqlite
      - name: Rebuild mention trends and site
        run: |
          uv run --no-sync python -m mentions.analysis --data data
          uv run --no-sync mentions-chart
      - name: Save test results
        if: inputs.test_month != ''
        uses: actions/upload-artifact@v4
        with:
          name: month-test-${{ github.run_id }}
          path: |
            data/corpus/
            output/*.json
            output/*.csv
            output/*.png
          if-no-files-found: error
      - name: Build production site
        if: inputs.test_month == ''
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          uv run --no-sync modal run scripts/modal_surveys.py --month "$TARGET_MONTH"
          uv run --no-sync python scripts/build_analysis_site.py
      - name: Persist validated production catalog
        if: inputs.test_month == ''
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: uv run --no-sync modal volume put --force robotics-research-papers data/analysis-papers.sqlite catalog.sqlite
      - name: Commit corpus and analysis
        if: inputs.test_month == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/corpus/*.jsonl
          git add output
          if ! git diff --cached --quiet; then
            git commit -m "chore: update cs.RO mention corpus"
            git push
          fi
      - name: Publish refreshed trends
        if: inputs.test_month == ''
        # GITHUB_TOKEN pushes do not trigger the push-based Pages workflow.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
